# ============================================================================
# Vending Machine Heatmap  --  Macaé / RJ
# ============================================================================
# This config drives the entire pipeline. To run for another city, copy this
# file, adjust the study area polygon + bbox and re-run.
# ============================================================================

city:
  name: "Macaé"
  slug: "macae"
  country: "BR"

# ----------------------------------------------------------------------------
# Study area
# ----------------------------------------------------------------------------
# The user asked specifically to focus on Macaé's consolidated urban area,
# on the MAIN side before Ponte da Barra. That means:
#   - include:   Centro, Imbetiba, Cavaleiros, Granja dos Cavaleiros,
#                Glória, Praia Campista, Costa do Sol, Riviera, Lagomar,
#                Nova Holanda, Bosque Azul, Visconde de Araújo, etc.
#   - exclude:   Barra de Macaé (the strip north of Rio Macaé), aeroporto,
#                Imboassica industrial, rural periphery.
#
# The polygon below approximates that cut. Rio Macaé flows roughly
# west→east and reaches the sea at the Ponte da Barra; the polygon
# stays south/southwest of that line.
#
# If you need to change it, keep vertices in [lon, lat] order and go
# counter-clockwise or clockwise consistently.
# ----------------------------------------------------------------------------
study_area:
  bbox:
    # Generous bbox: covers everything from Ponte da Barra westward and
    # southward. Used only to narrow Overpass queries; the polygon below
    # plus the water mask define what actually scores.
    min_lon: -41.875
    min_lat: -22.495
    max_lon: -41.775
    max_lat: -22.380
  polygon:
    # ENTIRE south zone: Centro/Imbetiba/Cavaleiros (east) → Granja dos
    # Cavaleiros / Glória / São Marcos (mid) → Cancela Preta /
    # Bosque Azul / Virgem Santa / Nova Holanda (west) →
    # Costa do Sol / Riviera Fluminense / Lagomar (south).
    # Vertices ordered NE→SE→SW→NW for a clean polygon.
    - [-41.792, -22.385]  # NE — south bank of Rio Macaé, near Ponte da Barra
    - [-41.785, -22.388]
    - [-41.781, -22.395]  # Imbetiba coast
    - [-41.780, -22.420]  # Cavaleiros coast
    - [-41.781, -22.440]  # Praia Campista coast
    - [-41.785, -22.460]  # Costa do Sol coast
    - [-41.795, -22.482]  # Lagomar south
    - [-41.815, -22.490]  # SW corner of urbanized area
    - [-41.850, -22.488]
    - [-41.872, -22.470]
    - [-41.875, -22.450]  # W
    - [-41.875, -22.420]
    - [-41.870, -22.405]  # NW — Cancela Preta west
    - [-41.860, -22.395]
    - [-41.840, -22.388]
    - [-41.820, -22.385]  # Centro/Botafogo south of river
    - [-41.800, -22.385]
    - [-41.792, -22.385]  # close
  water_mask:
    enabled: true
    overlap_threshold: 0.30

# ----------------------------------------------------------------------------
# Grid (H3 hexagons)
# ----------------------------------------------------------------------------
# res 9  ≈ 174m edge / ~0.10 km² per cell  — recommended for ~150-300m cells
# res 10 ≈ 66m  edge / ~0.015 km²         — finer, but heavier
grid:
  type: "h3"
  # res 9  ≈ 174m edge / ~0.10 km² per cell
  # res 10 ≈ 66m  edge / ~0.015 km² per cell — finer (default; user wants block-level detail)
  h3_resolution: 10

# ----------------------------------------------------------------------------
# Overpass / data sources
# ----------------------------------------------------------------------------
overpass:
  endpoint: "https://overpass-api.de/api/interpreter"
  timeout_s: 180
  retries: 3
  retry_backoff_s: 5
  cache_dir: "output/cache"

# ----------------------------------------------------------------------------
# POI categories we pull from OSM
# Each category accumulates one "feature count" per cell.
# Weights below combine them into the final score.
# ----------------------------------------------------------------------------
# Two-axis categorization for vending-machine prospection:
#
#   TRAFFIC GENERATORS  → bring foot traffic that consumes vending without
#                         direct competition (school, gym, office, hospital).
#                         Counted as POSITIVE in the cell score.
#
#   COMPETITORS         → POIs that sell snacks/drinks/conveniência directly
#                         (supermarket, mercearia, padaria, lanchonete, food
#                         court, fast food, cafe, bar, farmácia, conveniência).
#                         Counted as NEGATIVE in the cell score — they eat
#                         vending demand.
#
#   POTENTIAL HOSTS     → non-food shops where the machine could plausibly be
#                         installed (papelaria, salão, lavanderia, oficina,
#                         clothes, shoes, etc.). Counted as POSITIVE — at the
#                         cell level, more candidate hosts = better.
#
poi_categories:
  # ------------------------------------------------------------ traffic
  education:
    role: traffic
    query:
      - "amenity=school"
      - "amenity=college"
      - "amenity=university"
      - "amenity=kindergarten"
      - "amenity=language_school"
  fitness:
    role: traffic
    query:
      - "leisure=fitness_centre"
      - "leisure=sports_centre"
      - "sport=fitness"
  healthcare:
    role: traffic
    query:
      - "amenity=hospital"
      - "amenity=clinic"
      - "amenity=doctors"
      - "healthcare=clinic"
      - "healthcare=hospital"
      - "healthcare=doctor"
  office:
    role: traffic
    query:
      - "office"
      - "amenity=coworking_space"
  bank:
    role: traffic
    query:
      - "amenity=bank"
      - "amenity=atm"
  transport:
    role: traffic
    query:
      - "highway=bus_stop"
      - "public_transport=stop_position"
      - "public_transport=platform"
      - "amenity=bus_station"
      - "railway=station"
  leisure:
    role: traffic
    query:
      - "leisure=park"
      - "leisure=playground"
      - "leisure=stadium"
      - "tourism=attraction"
      - "tourism=hotel"
  fuel:
    role: traffic
    query:
      - "amenity=fuel"

  # --------------------------------------------------------- competitors
  competition_food:
    role: competition
    query:
      - "amenity=restaurant"
      - "amenity=fast_food"
      - "amenity=cafe"
      - "amenity=bar"
      - "amenity=pub"
      - "amenity=food_court"
      - "amenity=ice_cream"
  competition_supermarket:
    role: competition
    query:
      - "shop=supermarket"
      - "shop=convenience"
      - "shop=mall"
      - "shop=department_store"
      - "shop=greengrocer"
      - "shop=deli"
      - "shop=butcher"
      - "shop=kiosk"
  competition_bakery:
    role: competition
    query:
      - "shop=bakery"
      - "shop=confectionery"
      - "shop=pastry"
      - "shop=chocolate"
  competition_pharmacy:
    role: competition
    query:
      - "amenity=pharmacy"
      - "healthcare=pharmacy"

  # --------------------------------------------------------- potential hosts
  # All shops EXCEPT the ones tagged as competition above. We still query
  # `shop` (broad) and the source filter at runtime drops the competition
  # subtypes so we don't double-count.
  potential_host:
    role: host
    query:
      - "shop"
    drop_subtypes:
      - "supermarket"
      - "convenience"
      - "mall"
      - "department_store"
      - "greengrocer"
      - "deli"
      - "butcher"
      - "kiosk"
      - "bakery"
      - "confectionery"
      - "pastry"
      - "chocolate"

# ----------------------------------------------------------------------------
# Landuse / context (used for penalties + context, NOT scored as POI count)
# ----------------------------------------------------------------------------
landuse_categories:
  residential:
    query:
      - "landuse=residential"
      - "building=residential"
      - "building=apartments"
  commercial:
    query:
      - "landuse=commercial"
      - "landuse=retail"
      - "building=commercial"
      - "building=retail"
  industrial:
    query:
      - "landuse=industrial"
      - "building=industrial"
      - "landuse=port"
  unsuitable:
    # Heavy penalty: nature, water, airport, military, farm, wood.
    # NOTE: natural=beach is deliberately NOT here — in Macaé's south zone
    # the beach strip is high-traffic (kiosks, tourism, beachfront bars)
    # and must not pull coastal urban cells down.
    query:
      - "landuse=forest"
      - "landuse=farmland"
      - "landuse=meadow"
      - "natural=wood"
      - "natural=wetland"
      - "natural=water"
      - "landuse=military"
      - "aeroway=aerodrome"
      - "aeroway=runway"

# ----------------------------------------------------------------------------
# Roads (used for connectivity signal)
# ----------------------------------------------------------------------------
roads:
  query:
    - "highway=primary"
    - "highway=secondary"
    - "highway=tertiary"
    - "highway=residential"
    - "highway=trunk"
    - "highway=unclassified"
    - "highway=living_street"

# ----------------------------------------------------------------------------
# Scoring weights (positive features)
# ----------------------------------------------------------------------------
# These are applied AFTER per-feature normalization to [0,1] and AFTER
# spatial smoothing over cell neighborhoods.
# ----------------------------------------------------------------------------
weights:
  positive:
    # ---- traffic generators (foot traffic, NOT competing with vending) ----
    education:        1.4   # estudantes = público vending por excelência
    fitness:          1.2   # academia = audiência cativa
    office:           1.2   # trabalhadores
    healthcare:       1.0   # hospital/clínica = espera + visitantes
    transport:        1.0   # paradas = fluxo de passagem
    bank:             0.6   # fluxo curto, mas regular
    leisure:          0.5   # parque/lazer; turismo cobre orla via cenário
    fuel:             0.4   # frentista + clientes brevemente parados
    # ---- demand proxies (not direct POIs) -----------------
    residential:      1.5   # densidade habitacional = demanda de base
    mixed_use:        0.8   # diversidade DOS GERADORES de tráfego (não comércio)
    road_density:     0.8   # conectividade — chega lá fácil
    anchor_proximity: 1.5   # distância a um gerador de tráfego forte
    # ---- non-food shops that COULD HOST the machine -----
    potential_host:   1.0   # cada papelaria/salão/lavanderia adjacente vale

  # Negative weights for direct competitors. These SUBTRACT from the cell
  # score because they sell the same things a vending machine does.
  competition:
    competition_supermarket: 2.0   # supermercado/conveniência = competidor #1
    competition_food:        1.6   # restaurante/lanchonete/bar/fast-food
    competition_bakery:      1.5   # padaria/confeitaria
    competition_pharmacy:    0.8   # farmácia (snack no caixa, mas auxiliar)

  # Geographic/landuse penalties (independent of POIs)
  penalties:
    unsuitable_landuse: 2.5   # água/mata/aeródromo/militar/agrícola
    industrial:         0.3
    isolation:          1.0   # se nada de tráfego ao redor, a célula morre
    low_connectivity:   0.4

# ----------------------------------------------------------------------------
# Spatial smoothing — simulate walking/catchment radius.
# Each cell is enriched by the sum of its ring neighbors' POIs,
# attenuated by 'decay' per ring.
# ----------------------------------------------------------------------------
smoothing:
  # At res 10 each ring is ~130m. Walk-radius ~600m → ~5 rings.
  neighbor_rings: 5
  decay: 0.7

# ----------------------------------------------------------------------------
# Cluster building (for prospection)
# ----------------------------------------------------------------------------
clusters:
  score_threshold: 55.0   # cells with score >= this become eligible
  min_cells: 4            # smaller res 10 cells need a higher floor to qualify
  top_n: 10               # how many clusters to surface in shortlist / map / KML
  peak_radius_rings: 5    # min H3 distance between two seeds at res 10 (~ ~600m)
  super_cluster_merge_m: 650.0     # merge micro-clusters if centroid distance <= this
  super_cluster_seed_rings: 8      # OR if their seeds are <= N H3 rings apart (res 10 → ~1.0km)

# ----------------------------------------------------------------------------
# Operational scenario
# ----------------------------------------------------------------------------
# - convenience_urban: discount cells whose value is driven by beach/orla
# - beach_tourism:     mild boost for beach-adjacent cells
scenario: "convenience_urban"

# ----------------------------------------------------------------------------
# Field-visit routing
# ----------------------------------------------------------------------------
routing:
  max_stops_day1: 5
  max_stops_day2: 6

# ----------------------------------------------------------------------------
# Output
# ----------------------------------------------------------------------------
output:
  dir: "output"
  html: "macae_vending_heatmap.html"
  geojson: "macae_grid_scores.geojson"
  csv_top: "macae_top_cells.csv"
  csv_all: "macae_all_cells.csv"
  report_md: "macae_report.md"
  top_n: 40

# ----------------------------------------------------------------------------
# Map rendering
# ----------------------------------------------------------------------------
map:
  center: [-22.412, -41.793]   # Cavaleiros area — good default view
  zoom_start: 13
  fill_opacity: 0.55
  line_opacity: 0.15
  include_heatmap_layer: true  # also render a smoothed Leaflet heatmap overlay
  include_top_markers: true
